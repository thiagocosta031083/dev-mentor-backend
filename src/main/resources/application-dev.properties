# ===== H2 =====
spring.datasource.url=jdbc:h2:mem:devmentor
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.web=INFO

app.initial-user.name=Thiago Costa
app.initial-user.email=thiago@devmentor.local
app.initial-user.password=devmentor123
app.jwt.secret=dev-mentor-v1-development-secret-key-with-at-least-32-bytes
